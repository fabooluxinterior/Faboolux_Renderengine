<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGPU PBR Engine</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            margin: 0; 
            background-color: #0b0b0c; 
            display: flex; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh; 
            overflow: hidden;
            color: #e2e8f0;
        }
        /* UI Control Panel */
        #sidebar {
            width: 320px;
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255,255,255,0.08);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        h2 { font-size: 1.1rem; margin: 0 0 10px 0; font-weight: 600; color: #fff; }
        .upload-box {
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background: rgba(255,255,255,0.02);
        }
        .upload-box:hover { border-color: #3b82f6; background: rgba(59,130,246,0.04); }
        .upload-box input { display: none; }
        .thumbnail-container { display: none; margin-top: 10px; width: 100%; height: 120px; border-radius: 6px; overflow: hidden; background: #000; }
        .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .progress-section { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 12px; display: none; }
        .progress-bar { width: 100%; height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .progress-fill { width: 0%; height: 100%; background: #3b82f6; transition: width 0.3s; }

        .slider-group { display: flex; flex-direction: column; gap: 6px; }
        label { font-size: 0.85rem; color: #94a3b8; }
        input[type="range"] { width: 100%; accent-color: #3b82f6; cursor: pointer; }
        
        .stats { margin-top: auto; font-size: 0.75rem; color: #64748b; line-height: 1.4; border-top: 1px solid rgba(255,255,255,0.05); pt-12: 12px; }
        .btn { background: #3b82f6; border: none; color: #fff; padding: 10px; border-radius: 6px; font-weight: 600; cursor: pointer; text-align: center; }
        .btn:hover { background: #2563eb; }

        /* Render Canvas */
        #viewport {
            flex-grow: 1;
            position: relative;
            background: #000;
        }
        canvas { 
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <div>
            <h2>Upload Source Image</h2>
            <label class="upload-box" id="dropzone">
                <span id="upload-text">Drag or Click to Upload Interior Photo</span>
                <input type="file" id="imageInput" accept="image/*">
                <div class="thumbnail-container" id="thumbContainer">
                    <img id="thumbImg" src="" alt="Thumbnail">
                </div>
            </label>
        </div>

        <div class="progress-section" id="progressSection">
            <span style="font-size: 0.8rem; font-weight: 500;">Mesh & Lighting Extraction</span>
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
        </div>

        <div class="slider-group">
            <label>Brightness</label>
            <input type="range" min="0" max="2" step="0.05" value="1.0" id="brightness">
        </div>
        <div class="slider-group">
            <label>Material Realism</label>
            <input type="range" min="0.5" max="2" step="0.05" value="1.2" id="realism">
        </div>
        <div class="slider-group">
            <label>Roughness</label>
            <input type="range" min="0" max="1" step="0.05" value="0.5" id="roughness">
        </div>
        <div class="slider-group">
            <label>Light Intensity</label>
            <input type="range" min="0" max="15" step="0.5" value="10.0" id="lightIntensity">
        </div>

        <button class="btn">RENDER EXPORT</button>

        <div class="stats">
            NVIDIA GeForce RTX 4060 Ti • Active<br>
            60 FPS • Real-time WebGPU Path Tracing
        </div>
    </div>

    <div id="viewport">
        <canvas id="engineCanvas"></canvas>
    </div>

    <script type="module" src="engine.js"></script>
</body>
</html>
